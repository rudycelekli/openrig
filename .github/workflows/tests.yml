name: OpenRig1416 focused actual MCP proof
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  focused-native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        repository: mvschwarz/openrig
        ref: fbca021e59906e197f3fa835ec932801886c6d76
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm run build
    - name: Apply exact baseline packet
      shell: python
      run: 'import pathlib,subprocess,base64,hashlib

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''fbca021e59906e197f3fa835ec932801886c6d76''

        subprocess.run([''git'',''reset'',''--hard'',''HEAD''],check=True)

        p=base64.b64decode('''')

        assert hashlib.sha256(p).hexdigest()==''5189fdd06f61b5382d667a7d8402efaadcbdd6e7a7f0df633cdd4462baa67d8a''

        subprocess.run([''git'',''apply'',''--intent-to-add'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/1416-expected.patch'').write_bytes(p)

        '
    - name: baseline source before
      shell: python
      env:
        PROOF_POINT: before
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/1416-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''5189fdd06f61b5382d667a7d8402efaadcbdd6e7a7f0df633cdd4462baa67d8a''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''1416-''+''baseline''+''-''+os.environ[''PROOF_POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: Actual baseline focused unit and native MCP processes
      id: baseline
      continue-on-error: true
      run: "suite_root=$(mktemp -d \"$RUNNER_TEMP/opr-test.XXXXXX\")\nsuite_root=$(cd \"$suite_root\" && pwd -P)\nmkdir -p \"$suite_root/home\" \"$suite_root/bin\"\
        \n# Same system bytes, nonprivileged mode; no system file is changed.\n/usr/bin/install -m 0755 /bin/ps \"$suite_root/bin/ps\"\n# Only this job's temporary\
        \ sockets (including tmux) are reachable.\nenv -i HOME=\"$suite_root/home\" PATH=\"$PATH\" TMPDIR=\"$suite_root\" TMUX_TMPDIR=\"$suite_root\" \\\n  CI=true\
        \ TERM=xterm-256color RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  sandbox-exec -D IPC_ROOT=\"$suite_root\" -p '(version 1)(allow default)(deny network-outbound)(allow\
        \ network-outbound (remote ip \"localhost:*\"))(allow network-outbound (subpath (param \"IPC_ROOT\")))' \\\n  /bin/bash -s \"cli\" <<'SUITE'\nset -euo pipefail\n\
        node scripts/ci-macos-process-probe.mjs\n# The production readers use bare ps. Select real system bytes only after\n# self/owned-child observation and network/IPC\
        \ confinement are proved.\nexport PATH=\"$TMPDIR/bin:$PATH\"\ntest \"$(command -v ps)\" = \"$TMPDIR/bin/ps\"\nexec npm run test -w \"packages/$1\" -- test/mcp-serve-port.test.ts\
        \ test/mcp-serve-port-native.test.ts --reporter=json --outputFile=\"$RUNNER_TEMP/1416-baseline-vitest.json\"\nSUITE\n"
    - name: baseline source after
      if: always()
      shell: python
      env:
        PROOF_POINT: after
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/1416-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''5189fdd06f61b5382d667a7d8402efaadcbdd6e7a7f0df633cdd4462baa67d8a''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''1416-''+''baseline''+''-''+os.environ[''PROOF_POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: Validate exact baseline counts and infrastructure
      shell: python
      run: 'import json,pathlib,os

        d=json.loads(pathlib.Path(os.environ[''RUNNER_TEMP''],''1416-baseline-vitest.json'').read_text())

        aa=[a for t in d[''testResults''] for a in t[''assertionResults'']]

        assert len(d[''testResults''])==2 and len(aa)==14 and all(not t.get(''message'') for t in d[''testResults'']),d

        assert d[''numPendingTests'']==0 and d[''numTodoTests'']==0

        assert d[''numFailedTests'']==9 and d[''numPassedTests'']==5,d

        assert sum(a[''status'']==''failed'' for t in d[''testResults''] if t[''name''].endswith(''mcp-serve-port-native.test.ts'') for a in t[''assertionResults''])==4

        '
    - name: Apply exact candidate packet
      shell: python
      run: 'import pathlib,subprocess,base64,hashlib

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''fbca021e59906e197f3fa835ec932801886c6d76''

        subprocess.run([''git'',''reset'',''--hard'',''HEAD''],check=True)

        p=base64.b64decode('''')

        assert hashlib.sha256(p).hexdigest()==''dd7fc6c597502fc64a073a9b8e5d21f2e04c1ea2fc25e98569cd30723e914e93''

        subprocess.run([''git'',''apply'',''--intent-to-add'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/1416-expected.patch'').write_bytes(p)

        '
    - name: candidate source before
      shell: python
      env:
        PROOF_POINT: before
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/1416-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''dd7fc6c597502fc64a073a9b8e5d21f2e04c1ea2fc25e98569cd30723e914e93''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''1416-''+''candidate''+''-''+os.environ[''PROOF_POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: Actual candidate focused unit and native MCP processes
      id: candidate
      continue-on-error: false
      run: "suite_root=$(mktemp -d \"$RUNNER_TEMP/opr-test.XXXXXX\")\nsuite_root=$(cd \"$suite_root\" && pwd -P)\nmkdir -p \"$suite_root/home\" \"$suite_root/bin\"\
        \n# Same system bytes, nonprivileged mode; no system file is changed.\n/usr/bin/install -m 0755 /bin/ps \"$suite_root/bin/ps\"\n# Only this job's temporary\
        \ sockets (including tmux) are reachable.\nenv -i HOME=\"$suite_root/home\" PATH=\"$PATH\" TMPDIR=\"$suite_root\" TMUX_TMPDIR=\"$suite_root\" \\\n  CI=true\
        \ TERM=xterm-256color RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  sandbox-exec -D IPC_ROOT=\"$suite_root\" -p '(version 1)(allow default)(deny network-outbound)(allow\
        \ network-outbound (remote ip \"localhost:*\"))(allow network-outbound (subpath (param \"IPC_ROOT\")))' \\\n  /bin/bash -s \"cli\" <<'SUITE'\nset -euo pipefail\n\
        node scripts/ci-macos-process-probe.mjs\n# The production readers use bare ps. Select real system bytes only after\n# self/owned-child observation and network/IPC\
        \ confinement are proved.\nexport PATH=\"$TMPDIR/bin:$PATH\"\ntest \"$(command -v ps)\" = \"$TMPDIR/bin/ps\"\nexec npm run test -w \"packages/$1\" -- test/mcp-serve-port.test.ts\
        \ test/mcp-serve-port-native.test.ts --reporter=json --outputFile=\"$RUNNER_TEMP/1416-candidate-vitest.json\"\nSUITE\n"
    - name: candidate source after
      if: always()
      shell: python
      env:
        PROOF_POINT: after
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/1416-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''dd7fc6c597502fc64a073a9b8e5d21f2e04c1ea2fc25e98569cd30723e914e93''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''1416-''+''candidate''+''-''+os.environ[''PROOF_POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: Validate exact candidate counts and infrastructure
      shell: python
      run: 'import json,pathlib,os

        d=json.loads(pathlib.Path(os.environ[''RUNNER_TEMP''],''1416-candidate-vitest.json'').read_text())

        aa=[a for t in d[''testResults''] for a in t[''assertionResults'']]

        assert len(d[''testResults''])==2 and len(aa)==14 and all(not t.get(''message'') for t in d[''testResults'']),d

        assert d[''numPendingTests'']==0 and d[''numTodoTests'']==0

        assert d[''numFailedTests'']==0 and d[''numPassedTests'']==14 and d[''success''],d

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openrig1416-focused-${{ github.run_id }}
        path: ${{ runner.temp }}/1416-*.json
        if-no-files-found: error
