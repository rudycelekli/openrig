name: Tests

# Builds, type-checks and runs every test suite on a clean GitHub runner, and records the file
# list each published package would contain. Each suite is its own job so one failure does not
# hide the others. No provider credentials or operator configuration are supplied.
# Package suites deny external networking; scenario runtime has no external route.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 25c9bd5c3369084976ee0b0164ddd24226fb2be6
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "25c9bd5c3369084976ee0b0164ddd24226fb2be6"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record the published file list of each package
        run: |
          set -euo pipefail
          mkdir -p pack-lists
          for p in cli daemon tui; do
            (cd packages/$p && npm pack --dry-run --json --ignore-scripts) \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const f of JSON.parse(s)[0].files)console.log(f.path)})' \
              | sort > pack-lists/$p.txt
            echo "$p: $(wc -l < pack-lists/$p.txt) files"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pack-lists
          path: pack-lists/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 25c9bd5c3369084976ee0b0164ddd24226fb2be6
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "25c9bd5c3369084976ee0b0164ddd24226fb2be6"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 25c9bd5c3369084976ee0b0164ddd24226fb2be6
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "25c9bd5c3369084976ee0b0164ddd24226fb2be6"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:repo

  package-tests:
    # macOS, the platform OpenRig runs on: several daemon and cli tests read macOS ps columns,
    # file-inode behaviour and release tags.
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [daemon, cli, tui, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 25c9bd5c3369084976ee0b0164ddd24226fb2be6
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "25c9bd5c3369084976ee0b0164ddd24226fb2be6"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      - run: npm ci
      - name: Build the packages the tests import
        run: npm run build
      - name: Run the suite without ambient credentials or external network
        run: |
          suite_root=$(mktemp -d "$RUNNER_TEMP/opr-test.XXXXXX")
          suite_root=$(cd "$suite_root" && pwd -P)
          mkdir -p "$suite_root/home" "$suite_root/bin"
          # Same system bytes, nonprivileged mode; no system file is changed.
          /usr/bin/install -m 0755 /bin/ps "$suite_root/bin/ps"
          # Only this job's temporary sockets (including tmux) are reachable.
          env -i HOME="$suite_root/home" PATH="$PATH" TMPDIR="$suite_root" TMUX_TMPDIR="$suite_root" \
            CI=true TERM=xterm-256color \
            sandbox-exec -D IPC_ROOT="$suite_root" -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*"))(allow network-outbound (subpath (param "IPC_ROOT")))' \
            /bin/bash -s "${{ matrix.package }}" <<'SUITE'
          set -euo pipefail
          node scripts/ci-macos-process-probe.mjs
          # The production readers use bare ps. Select real system bytes only after
          # self/owned-child observation and network/IPC confinement are proved.
          export PATH="$TMPDIR/bin:$PATH"
          test "$(command -v ps)" = "$TMPDIR/bin/ps"
          exec npm run test -w "packages/$1"
          SUITE

  installed-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 25c9bd5c3369084976ee0b0164ddd24226fb2be6
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "25c9bd5c3369084976ee0b0164ddd24226fb2be6"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed package, daemon restart, and seeded durability failure
        run: bash scripts/run-pr-scenarios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-scenario-evidence
          path: dist/pr-scenarios/
          if-no-files-found: error

  rollback-proof:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 25c9bd5c3369084976ee0b0164ddd24226fb2be6
      - name: Verify exact source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "25c9bd5c3369084976ee0b0164ddd24226fb2be6"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      - run: npm ci
      - name: Prove both regressions on previous production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rollback-proof
          git rev-parse HEAD > rollback-proof/source-head.txt
          git show 751265e1545db80177502590fbb40f52510839f6:packages/cli/src/commands/scope.ts > packages/cli/src/commands/scope.ts
          npm run build
          set +e
          (cd packages/cli && npx vitest run test/scope-slice-claims.test.ts -t 'an (incomplete creator preserves concurrent parent edits|isolated incomplete failure retains parent persistence)' --reporter=junit --outputFile=../../rollback-proof/before.xml) > rollback-proof/before.log 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          python3 - <<'PROOF'
          import xml.etree.ElementTree as ET
          tree=ET.parse('rollback-proof/before.xml')
          cases=[c for c in tree.iter('testcase') if c.find('failure') is not None]
          assert len(cases)==4, [(c.attrib, list(c)) for c in cases]
          for c in cases:
              assert any(name in c.attrib['name'] for name in ['an incomplete creator preserves concurrent parent edits', 'an isolated incomplete failure retains parent persistence'])
              assert 'AssertionError' in ''.join(c.find('failure').itertext())
          PROOF
      - name: Restore exact source and run native controls
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- packages/cli/src/commands/scope.ts
          git diff --exit-code
          git diff --cached --exit-code
          npm run build
          (cd packages/cli && npx vitest run test/scope-slice-claims.test.ts --reporter=junit --outputFile=../../rollback-proof/after.xml) > rollback-proof/after.log 2>&1
          python3 - <<'PROOF'
          import xml.etree.ElementTree as ET
          tree=ET.parse('rollback-proof/after.xml')
          cases=list(tree.iter('testcase'))
          assert len(cases)==17, len(cases)
          assert not any(c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None for c in cases)
          PROOF
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD^{tree} > rollback-proof/tested-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-native-proof
          path: rollback-proof/
