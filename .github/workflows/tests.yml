name: Agency example converter proof

# Task-owned contribution experiment on the OpenRig fork. This is not the
# official Agency or OpenRig test workflow. No skill or production install,
# release or deployment. PyYAML is installed as a test parser dependency.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agency-examples-${{ github.ref }}
  cancel-in-progress: false
jobs:
  converters:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        candidate: [identity-default, support-known-status, shap-kernel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: proof
      - name: Select an immutable source revision
        id: source
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('proof/campaign-proof/agency-examples/manifest.json'))
          item = manifest['candidates'][os.environ['CANDIDATE']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"head={item['head']}\n")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rudycelekli/agency-agents
          ref: ${{ steps.source.outputs.head }}
          fetch-depth: 2
          persist-credentials: false
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Supply the converter's declared parser dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify source bytes and test the receipt evaluator
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          mkdir -p evidence
          python3 proof/campaign-proof/agency-examples/verify.py guard source "$CANDIDATE" > evidence/source-guard.json
          python3 proof/campaign-proof/agency-examples/verify.py self-test > evidence/evaluator-controls.json
          git -C proof rev-parse HEAD > evidence/proof-head.txt
          python3 --version > evidence/runtime.txt
          python3 -c 'import yaml; print(yaml.__version__)' >> evidence/runtime.txt
      - name: Run the complete converter contract and agent checks
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          agent=$(python3 - "$CANDIDATE" <<'PY'
          import json, sys
          print(json.load(open('proof/campaign-proof/agency-examples/manifest.json'))['candidates'][sys.argv[1]]['file'])
          PY
          )
          (cd source && bash scripts/lint-agents.sh "$agent") 2>&1 | tee evidence/lint.log
          (cd source && bash scripts/check-agent-originality.sh "$agent") 2>&1 | tee evidence/originality.log
          (cd source && bash scripts/test-convert-outputs.sh --drift=advisory) 2>&1 | tee evidence/converters.log
          python3 proof/campaign-proof/agency-examples/verify.py summary evidence/converters.log > evidence/converter-verdict.json
          python3 proof/campaign-proof/agency-examples/verify.py guard source "$CANDIDATE" > evidence/source-guard-after.json
          test -z "$(git -C source status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agency-example-${{ matrix.candidate }}
          path: evidence/
          if-no-files-found: error
