name: OpenRig1415 corrected native evaluator
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: openrig1415-native-parallel-20261020
  cancel-in-progress: false
jobs:
  native-tmux35a:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
      with:
        repository: mvschwarz/openrig
        ref: d93377f3f9d9728458127c7e8773484cfdd82dd6
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Build pinned upstream tmux3.5a in runner temporary directory
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y libevent-dev libncurses-dev bison autoconf automake pkg-config

        git clone --filter=blob:none https://github.com/tmux/tmux.git "$RUNNER_TEMP/tmux35a"

        git -C "$RUNNER_TEMP/tmux35a" checkout --detach 549c35b06165f6ae023115eb76f83f2cbf945395

        test "$(git -C "$RUNNER_TEMP/tmux35a" rev-parse HEAD)" = 549c35b06165f6ae023115eb76f83f2cbf945395

        cd "$RUNNER_TEMP/tmux35a"

        sh autogen.sh

        ./configure --prefix="$RUNNER_TEMP/tmux35a-installed"

        make -j2

        make install

        echo "$RUNNER_TEMP/tmux35a-installed/bin" >> "$GITHUB_PATH"

        '
    - run: tmux -V | tee "$RUNNER_TEMP/tmux-version.txt"; test "$(tmux -V)" = "tmux 3.5a"
      shell: bash
    - run: npm ci
    - run: npm run build
    - name: Apply tests-only packet for genuine source baseline
      shell: python
      run: 'import base64,hashlib,pathlib,subprocess,json

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''d93377f3f9d9728458127c7e8773484cfdd82dd6''

        p=base64.b64decode('''');
        assert hashlib.sha256(p).hexdigest()==''6d46c825b00e7be1467f71d005149d2d1c361de5ba8dabb449741d88abb021ad''

        subprocess.run([''git'',''apply'',''--check'',''-''],input=p,check=True)

        subprocess.run([''git'',''apply'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/openrig1415-expected.patch'').write_bytes(p)

        pathlib.Path(''/tmp/openrig1415-files.json'').write_text(''{"packages/cli/src/commands/chatroom.ts": {"baseline_sha256": "a663d18fa0f5a8446e5b4ae49419c10fa8f38e286584ed3867558b07cd62b1c6",
        "candidate_sha256": "2cdee3fa5f191bb17b2a988570801d42bc06f9bda38352eb09801766ecb13c3a", "snapshot": "/Users/rudycelekli/Downloads/RLGYM/upstream-prs-2026-09/campaign-records/daily-runs/20261020T125951Z-heartbeat/lane-3/openrig1415/candidate-chatroom.ts"},
        "packages/cli/test/chatroom-watch-tmux-args.test.ts": {"baseline_sha256": "e8fbdd008f59438eba68965f7c1d87cb9b68a5401d609472bed58aa6a0a2427d",
        "candidate_sha256": "f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558", "snapshot": "/Users/rudycelekli/Downloads/RLGYM/upstream-prs-2026-09/campaign-records/daily-runs/20261020T125951Z-heartbeat/lane-3/openrig1415/candidate-chatroom-watch-tmux-args.test.ts"}}'')

        '
    - name: Strict baseline pre-test identity
      shell: python
      run: 'import subprocess,pathlib,hashlib,json,os

        expected={''packages/cli/test/chatroom-watch-tmux-args.test.ts'': ''f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558''}

        for p,h in expected.items(): assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,(p,''source bytes changed'')

        actual=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert actual==pathlib.Path(''/tmp/openrig1415-expected.patch'').read_bytes(),''canonical patch/path identity changed''

        pathlib.Path(os.environ[''RUNNER_TEMP''],''source-identity-''+os.environ.get(''QUAL_PHASE'',''unknown'')+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(actual).hexdigest(),''files'':expected},indent=2))

        '
      env:
        QUAL_PHASE: baseline-before
    - name: Run exact double-hash baseline cases, retaining failure
      shell: bash
      run: 'set +e

        npm exec -w packages/cli -- vitest run test/chatroom-watch-tmux-args.test.ts -t ''double##tag'' --reporter=json --outputFile="$RUNNER_TEMP/baseline-vitest.json"
        > "$RUNNER_TEMP/baseline-vitest.log" 2>&1

        status=$?

        echo "$status" > "$RUNNER_TEMP/baseline-exit.txt"

        cat "$RUNNER_TEMP/baseline-vitest.log"

        exit 0

        '
    - name: Require two selected semantic failures, never infra or skips
      shell: python
      run: 'import json,pathlib,os

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']); r=json.loads((p/''baseline-vitest.json'').read_text()); assert (p/''baseline-exit.txt'').read_text().strip()==''1''

        assert r[''numTotalTests'']==28 and r[''numFailedTests'']==2 and r[''numPassedTests'']==0 and r[''numPendingTests'']==26,r

        selected=[a for t in r[''testResults''] for a in t[''assertionResults''] if a[''status''] not in (''pending'',''skipped'')]

        assert len(selected)==2 and all(a[''status'']==''failed'' and ''double##tag'' in a[''fullName''] for a in selected)

        assert any(''native tmux'' in a[''fullName''] and ''chatroom@double##tag'' in ''\n''.join(a[''failureMessages'']) for a in selected)

        assert any(''passes'' in a[''fullName''] and ''literal watcher arguments'' in a[''fullName''] for a in selected)

        assert all(''AssertionError'' in ''\n''.join(a[''failureMessages'']) for a in selected)

        log=(p/''baseline-vitest.log'').read_text(); assert not any(x in log for x in [''Failed to load url'',''Cannot find module'',''SyntaxError'',''No
        test files found''])


        assert sum(a[''status''] in (''pending'',''skipped'') for t in r[''testResults''] for a in t[''assertionResults''])==26

        '
    - name: Strict baseline post-test identity
      shell: python
      run: 'import subprocess,pathlib,hashlib,json,os

        expected={''packages/cli/test/chatroom-watch-tmux-args.test.ts'': ''f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558''}

        for p,h in expected.items(): assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,(p,''source bytes changed'')

        actual=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert actual==pathlib.Path(''/tmp/openrig1415-expected.patch'').read_bytes(),''canonical patch/path identity changed''

        pathlib.Path(os.environ[''RUNNER_TEMP''],''source-identity-''+os.environ.get(''QUAL_PHASE'',''unknown'')+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(actual).hexdigest(),''files'':expected},indent=2))

        '
      env:
        QUAL_PHASE: baseline-after
    - name: Restore only the tests-only baseline path
      run: git restore -- packages/cli/test/chatroom-watch-tmux-args.test.ts
    - name: Apply exact candidate packet
      shell: python
      run: 'import base64,hashlib,pathlib,subprocess,json

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''d93377f3f9d9728458127c7e8773484cfdd82dd6''

        p=base64.b64decode('''');
        assert hashlib.sha256(p).hexdigest()==''95a45a13d1cb66595b085e92992c3de36931a74961bd6bf3f12f27492602a6b8''

        subprocess.run([''git'',''apply'',''--check'',''-''],input=p,check=True)

        subprocess.run([''git'',''apply'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/openrig1415-expected.patch'').write_bytes(p)

        pathlib.Path(''/tmp/openrig1415-files.json'').write_text(''{"packages/cli/src/commands/chatroom.ts": {"baseline_sha256": "a663d18fa0f5a8446e5b4ae49419c10fa8f38e286584ed3867558b07cd62b1c6",
        "candidate_sha256": "2cdee3fa5f191bb17b2a988570801d42bc06f9bda38352eb09801766ecb13c3a", "snapshot": "/Users/rudycelekli/Downloads/RLGYM/upstream-prs-2026-09/campaign-records/daily-runs/20261020T125951Z-heartbeat/lane-3/openrig1415/candidate-chatroom.ts"},
        "packages/cli/test/chatroom-watch-tmux-args.test.ts": {"baseline_sha256": "e8fbdd008f59438eba68965f7c1d87cb9b68a5401d609472bed58aa6a0a2427d",
        "candidate_sha256": "f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558", "snapshot": "/Users/rudycelekli/Downloads/RLGYM/upstream-prs-2026-09/campaign-records/daily-runs/20261020T125951Z-heartbeat/lane-3/openrig1415/candidate-chatroom-watch-tmux-args.test.ts"}}'')

        '
      id: applycandidate
    - name: Strict candidate native pre-test identity
      shell: python
      run: 'import subprocess,pathlib,hashlib,json,os

        expected={''packages/cli/src/commands/chatroom.ts'': ''2cdee3fa5f191bb17b2a988570801d42bc06f9bda38352eb09801766ecb13c3a'', ''packages/cli/test/chatroom-watch-tmux-args.test.ts'':
        ''f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558''}

        for p,h in expected.items(): assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,(p,''source bytes changed'')

        actual=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert actual==pathlib.Path(''/tmp/openrig1415-expected.patch'').read_bytes(),''canonical patch/path identity changed''

        pathlib.Path(os.environ[''RUNNER_TEMP''],''source-identity-''+os.environ.get(''QUAL_PHASE'',''unknown'')+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(actual).hexdigest(),''files'':expected},indent=2))

        '
      env:
        QUAL_PHASE: candidate-before
    - name: Run all fourteen native cases and fourteen exact argv cases
      run: npm exec -w packages/cli -- vitest run test/chatroom-watch-tmux-args.test.ts --reporter=json --outputFile="$RUNNER_TEMP/candidate-vitest.json"
    - name: Require all28 focused tests executed and passed
      shell: python
      run: 'import json,pathlib,os

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']);r=json.loads((p/''candidate-vitest.json'').read_text());assert r[''numTotalTests'']==28 and
        r[''numPassedTests'']==28 and r[''numFailedTests'']==0 and r[''numPendingTests'']==0,r

        selected=[a for t in r[''testResults''] for a in t[''assertionResults'']];assert len(selected)==28 and all(a[''status'']==''passed'' for
        a in selected)

        assert sum(''native tmux'' in a[''fullName''] for a in selected)==14

        '
    - name: Strict candidate native final identity
      shell: python
      run: 'import subprocess,pathlib,hashlib,json,os

        expected={''packages/cli/src/commands/chatroom.ts'': ''2cdee3fa5f191bb17b2a988570801d42bc06f9bda38352eb09801766ecb13c3a'', ''packages/cli/test/chatroom-watch-tmux-args.test.ts'':
        ''f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558''}

        for p,h in expected.items(): assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,(p,''source bytes changed'')

        actual=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert actual==pathlib.Path(''/tmp/openrig1415-expected.patch'').read_bytes(),''canonical patch/path identity changed''

        pathlib.Path(os.environ[''RUNNER_TEMP''],''source-identity-''+os.environ.get(''QUAL_PHASE'',''unknown'')+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(actual).hexdigest(),''files'':expected},indent=2))

        '
      if: always() && steps.applycandidate.outcome == 'success'
      env:
        QUAL_PHASE: candidate-after
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openrig1415-tmux35a-${{ github.run_id }}
        path: '${{ runner.temp }}/source-identity-*.json

          ${{ runner.temp }}/*vitest*

          ${{ runner.temp }}/baseline-exit.txt

          ${{ runner.temp }}/tmux-version.txt'
        if-no-files-found: error
