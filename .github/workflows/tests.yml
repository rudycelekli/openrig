name: Tests

# Builds, type-checks and runs every test suite on a clean GitHub runner, and records the file
# list each published package would contain. Each suite is its own job so one failure does not
# hide the others. No provider credentials or operator configuration are supplied.
# Package suites deny external networking; scenario runtime has no external route.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cf7bac9cc05c1658de6b1d991dd0cfab9908f319
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record the published file list of each package
        run: |
          set -euo pipefail
          mkdir -p pack-lists
          for p in cli daemon tui; do
            (cd packages/$p && npm pack --dry-run --json --ignore-scripts) \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const f of JSON.parse(s)[0].files)console.log(f.path)})' \
              | sort > pack-lists/$p.txt
            echo "$p: $(wc -l < pack-lists/$p.txt) files"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pack-lists
          path: pack-lists/
      - name: Verify final tested source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cf7bac9cc05c1658de6b1d991dd0cfab9908f319
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Verify final tested source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cf7bac9cc05c1658de6b1d991dd0cfab9908f319
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:repo
      - name: Verify final tested source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code

  package-tests:
    # macOS, the platform OpenRig runs on: several daemon and cli tests read macOS ps columns,
    # file-inode behaviour and release tags.
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [daemon, cli, tui, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: cf7bac9cc05c1658de6b1d991dd0cfab9908f319
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      - run: npm ci
      - name: Build the packages the tests import
        run: npm run build
      - name: Run the suite without ambient credentials or external network
        run: |
          suite_root=$(mktemp -d "$RUNNER_TEMP/opr-test.XXXXXX")
          suite_root=$(cd "$suite_root" && pwd -P)
          mkdir -p "$suite_root/home" "$suite_root/bin"
          # Same system bytes, nonprivileged mode; no system file is changed.
          /usr/bin/install -m 0755 /bin/ps "$suite_root/bin/ps"
          test "$(shasum -a 256 scripts/ci-macos-process-probe.mjs | cut -d ' ' -f1)" = "62c15ef6857638549439787629b9abee93f32e34a91ad6fa9b6e70b37cd82952"
          echo '' | base64 -D > "$suite_root/owned-process-probe.mjs"
          test "$(shasum -a 256 "$suite_root/owned-process-probe.mjs" | cut -d ' ' -f1)" = "8a896d2f5cc7d76369264348649795bce09976ab3eec14fda0e82908804cff35"
          diff -u scripts/ci-macos-process-probe.mjs "$suite_root/owned-process-probe.mjs" || test "$?" = 1
          # Only this job's temporary sockets (including tmux) are reachable.
          env -i PATH="$PATH" TMPDIR="$suite_root" TMUX_TMPDIR="$suite_root" \
            CI=true TERM=xterm-256color \
            sandbox-exec -D IPC_ROOT="$suite_root" -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*"))(allow network-outbound (subpath (param "IPC_ROOT")))' \
            /bin/bash -s "${{ matrix.package }}" <<'SUITE'
          set -euo pipefail
          node "$TMPDIR/owned-process-probe.mjs"
          # The production readers use bare ps. Select real system bytes only after
          # self/owned-child observation and network/IPC confinement are proved.
          export PATH="$TMPDIR/bin:$PATH"
          test "$(command -v ps)" = "$TMPDIR/bin/ps"
          exec npm run test -w "packages/$1"
          SUITE
      - name: Verify final tested source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code

  installed-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cf7bac9cc05c1658de6b1d991dd0cfab9908f319
      - name: Verify frozen source and clean index
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed package, daemon restart, and seeded durability failure
        run: bash scripts/run-pr-scenarios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-scenario-evidence
          path: dist/pr-scenarios/
          if-no-files-found: error
      - name: Verify final tested source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "cf7bac9cc05c1658de6b1d991dd0cfab9908f319"
          test "$(git rev-parse HEAD^{tree})" = "4e207396dfb6693bf8b5091da7a5ebb08e977c00"
          git diff --exit-code
          git diff --cached --exit-code

