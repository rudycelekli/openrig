name: Tests (fixed candidate, no uploads)

# Builds, type-checks and runs every test suite on a clean GitHub runner, and records the file
# list each published package would contain. Each suite is its own job so one failure does not
# hide the others. No provider credentials or operator configuration are supplied.
# Package suites deny external networking; scenario runtime has no external route.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact reviewed source and parent history
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          test "$(git rev-parse 'HEAD^{tree}')" = d903e5234e7c90fce206976e3c0fca4e488da1fe
          test "$(git rev-parse 'HEAD^')" = a2a37b165bc82e855d11df6759e6661b1070339f
          git cat-file -e 'a2a37b165bc82e855d11df6759e6661b1070339f^{commit}'
          git log -1 --format='%H %T %P'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Record the published file list of each package
        run: |
          set -euo pipefail
          mkdir -p pack-lists
          for p in cli daemon tui; do
            (cd packages/$p && npm pack --dry-run --json --ignore-scripts) \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const f of JSON.parse(s)[0].files)console.log(f.path)})' \
              | sort > pack-lists/$p.txt
            echo "$p: $(wc -l < pack-lists/$p.txt) files"
          done
      - name: Log bounded package-list receipts (no artifact upload)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const name of ['cli', 'daemon', 'tui']) {
            const path = `pack-lists/${name}.txt`;
            const bytes = readFileSync(path);
            const lines = bytes.toString().trimEnd().split('\n');
            console.log(JSON.stringify({ path, files: lines.length, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'), firstPaths: lines.slice(0, 40).map((line) => line.length > 300 ? line.slice(0, 300) + '[truncated]' : line), pathsOmitted: Math.max(0, lines.length - 40) }));
          }
          NODE

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact reviewed source and parent history
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          test "$(git rev-parse 'HEAD^{tree}')" = d903e5234e7c90fce206976e3c0fca4e488da1fe
          test "$(git rev-parse 'HEAD^')" = a2a37b165bc82e855d11df6759e6661b1070339f
          git cat-file -e 'a2a37b165bc82e855d11df6759e6661b1070339f^{commit}'
          git log -1 --format='%H %T %P'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact reviewed source and parent history
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          test "$(git rev-parse 'HEAD^{tree}')" = d903e5234e7c90fce206976e3c0fca4e488da1fe
          test "$(git rev-parse 'HEAD^')" = a2a37b165bc82e855d11df6759e6661b1070339f
          git cat-file -e 'a2a37b165bc82e855d11df6759e6661b1070339f^{commit}'
          git log -1 --format='%H %T %P'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:repo

  package-tests:
    # macOS, the platform OpenRig runs on: several daemon and cli tests read macOS ps columns,
    # file-inode behaviour and release tags.
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [daemon, cli, tui, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact reviewed source and parent history
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          test "$(git rev-parse 'HEAD^{tree}')" = d903e5234e7c90fce206976e3c0fca4e488da1fe
          test "$(git rev-parse 'HEAD^')" = a2a37b165bc82e855d11df6759e6661b1070339f
          git cat-file -e 'a2a37b165bc82e855d11df6759e6661b1070339f^{commit}'
          git log -1 --format='%H %T %P'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install tmux
      - run: npm ci
      - name: Build the packages the tests import
        run: npm run build
      - name: Run the suite without ambient credentials or external network
        run: |
          suite_root=$(mktemp -d "$RUNNER_TEMP/opr-test.XXXXXX")
          suite_root=$(cd "$suite_root" && pwd -P)
          mkdir -p "$suite_root/home" "$suite_root/bin"
          # Same system bytes, nonprivileged mode; no system file is changed.
          /usr/bin/install -m 0755 /bin/ps "$suite_root/bin/ps"
          # Only this job's temporary sockets (including tmux) are reachable.
          env -i HOME="$suite_root/home" PATH="$PATH" TMPDIR="$suite_root" TMUX_TMPDIR="$suite_root" \
            CI=true TERM=xterm-256color \
            sandbox-exec -D IPC_ROOT="$suite_root" -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*"))(allow network-outbound (subpath (param "IPC_ROOT")))' \
            /bin/bash -s "${{ matrix.package }}" <<'SUITE'
          set -euo pipefail
          node scripts/ci-macos-process-probe.mjs
          # The production readers use bare ps. Select real system bytes only after
          # self/owned-child observation and network/IPC confinement are proved.
          export PATH="$TMPDIR/bin:$PATH"
          test "$(command -v ps)" = "$TMPDIR/bin/ps"
          exec npm run test -w "packages/$1"
          SUITE

  installed-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact reviewed source and parent history
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 32e86a9b38f6538125cece24e9c17a9d24c3ff52
          test "$(git rev-parse 'HEAD^{tree}')" = d903e5234e7c90fce206976e3c0fca4e488da1fe
          test "$(git rev-parse 'HEAD^')" = a2a37b165bc82e855d11df6759e6661b1070339f
          git cat-file -e 'a2a37b165bc82e855d11df6759e6661b1070339f^{commit}'
          git log -1 --format='%H %T %P'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Installed package, daemon restart, and seeded durability failure
        run: bash scripts/run-pr-scenarios.sh
      - name: Log bounded scenario receipt hashes (no artifact upload)
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync, readFileSync, existsSync } from 'node:fs';
          import { join, relative } from 'node:path';
          import { createHash } from 'node:crypto';
          const root = 'dist/pr-scenarios';
          if (!existsSync(root)) {
            console.log('Scenario evidence directory absent; see the scenario step result.');
          } else {
            const paths = [];
            const walk = (dir) => {
              for (const entry of readdirSync(dir, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name))) {
                const path = join(dir, entry.name);
                if (entry.isDirectory()) walk(path);
                else if (entry.isFile()) paths.push(path);
              }
            };
            walk(root);
            let emitted = 0;
            let hashedBytes = 0;
            let omitted = 0;
            const manifest = createHash('sha256');
            for (const path of paths) {
              const size = statSync(path).size;
              const rel = relative(root, path);
              manifest.update(JSON.stringify([rel, size]) + '\n');
              if (emitted >= 160 || size > 8 * 1024 * 1024 || hashedBytes + size > 32 * 1024 * 1024 || rel.length > 500) { omitted++; continue; }
              const sha256 = createHash('sha256').update(readFileSync(path)).digest('hex');
              console.log(JSON.stringify({ path: rel, bytes: size, sha256 }));
              emitted++;
              hashedBytes += size;
            }
            console.log(JSON.stringify({ totalFiles: paths.length, emitted, omitted, hashedBytes, allPathSizeManifestSha256: manifest.digest('hex'), limits: '160 file lines, 500-character paths, 8MiB per file and32MiB total hashed; omitted payloads are not certified' }));
          }
          NODE
