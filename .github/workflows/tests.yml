name: Qualify Agency Bronze native provenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bronze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install --no-cache-dir pyspark==3.5.6 delta-spark==3.3.2
      - name: Execute complete documented blocks with native Spark and Delta disk roundtrips
        run: python campaign-proof/agency-bronze/reproduce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-bronze-native-proof
          path: campaign-proof/agency-bronze/results.json
          if-no-files-found: error
