name: OpenRig1415 bounded daemon baseline attribution
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  baseline:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
        persist-credentials: false
        repository: mvschwarz/openrig
        ref: d93377f3f9d9728458127c7e8773484cfdd82dd6
    - name: Exact initial source guard
      shell: python
      run: 'import subprocess

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''d93377f3f9d9728458127c7e8773484cfdd82dd6''

        assert not subprocess.check_output([''git'',''status'',''--porcelain''])'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: brew install tmux
    - run: npm ci
    - name: Build the packages the tests import
      run: npm run build
    - name: Run the suite without ambient credentials or external network
      run: "echo \"Starting unmodified fixture at $(date -u +%FT%TZ)\"\nsuite_root=$(mktemp -d \"$RUNNER_TEMP/opr-test.XXXXXX\")\nsuite_root=$(cd \"$suite_root\"\
        \ && pwd -P)\nmkdir -p \"$suite_root/home\" \"$suite_root/bin\"\n# Same system bytes, nonprivileged mode; no system file is changed.\n/usr/bin/install -m\
        \ 0755 /bin/ps \"$suite_root/bin/ps\"\n# Only this job's temporary sockets (including tmux) are reachable.\nenv -i HOME=\"$suite_root/home\" PATH=\"$PATH\"\
        \ TMPDIR=\"$suite_root\" TMUX_TMPDIR=\"$suite_root\" \\\n  CI=true TERM=xterm-256color \\\n  sandbox-exec -D IPC_ROOT=\"$suite_root\" -p '(version 1)(allow\
        \ default)(deny network-outbound)(allow network-outbound (remote ip \"localhost:*\"))(allow network-outbound (subpath (param \"IPC_ROOT\")))' \\\n  /bin/bash\
        \ -s \"daemon\" <<'SUITE'\nset -euo pipefail\nnode scripts/ci-macos-process-probe.mjs\n# The production readers use bare ps. Select real system bytes only\
        \ after\n# self/owned-child observation and network/IPC confinement are proved.\nexport PATH=\"$TMPDIR/bin:$PATH\"\ntest \"$(command -v ps)\" = \"$TMPDIR/bin/ps\"\
        \nexec npm run test -w \"packages/$1\" -- test/provider-usage-across-hosts.test.ts --reporter=json --outputFile=\"$TMPDIR/daemon-probe.json\"\nSUITE\n\n"
      continue-on-error: true
      id: probe
    - name: Exact baseline identity after probe
      if: always()
      shell: python
      run: 'import subprocess

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''d93377f3f9d9728458127c7e8773484cfdd82dd6''

        assert not subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])'
    - &id001
      name: Classify original expired fixture assertion without changing the test
      if: always()
      shell: python
      run: 'import pathlib,json,os

        reports=list(pathlib.Path(os.environ[''RUNNER_TEMP'']).glob(''opr-test.*/daemon-probe.json''))

        assert len(reports)==1,reports

        d=json.loads(reports[0].read_text())

        a=[a for t in d[''testResults''] for a in t[''assertionResults''] if ''a refresh slower than the 5 s read class still succeeds, and its reading reaches the
        view'' in a[''fullName'']]

        assert len(a)==1,a

        assert a[0][''status'']==''failed'',a

        messages=''\n''.join(a[0][''failureMessages''])

        assert ''nearing'' in messages and ''unknown'' in messages,messages

        print(json.dumps({''target_failure_reproduced'':True,''failed'':d[''numFailedTests''],''passed'':d[''numPassedTests''],''pending'':d[''numPendingTests''],''messages'':a[0][''failureMessages'']},indent=2))


        assert d["numRuntimeErrorTestSuites"]==0,d

        assert d["numTotalTests"]==39 and d["numPassedTests"]==38 and d["numFailedTests"]==1 and d["numPendingTests"]==0,d

        all_assertions=[a for t in d["testResults"] for a in t["assertionResults"]]

        expected_titles=[''one allowance on two hosts is one group with both observations, verbatim and never summed'', ''the same allowance whose fresh resets are
        more than 60 s apart is a conflict, both kept, none chosen'', ''resets within 60 s, or a stale observation that disagrees, are not a conflict'', ''the same
        Codex account id under different login emails stays apart as unknown linkage, naming the other host and the id'', ''a missing Codex login email links to nothing:
        by account id, by workspace id, and beside a reported email'', ''the same Claude email in two organisations is two allowances'', ''the same Codex login email
        under different account ids is two allowances, each its own entry'', ''an unresolved identity, or a source never read, is its own entry and never matched'',
        "map each kind of host answer to a leg; a bearer that can''t be resolved is never named", ''a leg asked for while the same (host, provider) leg runs joins
        it'', "one allowance on two hosts appears once, with each host''s own served row and the time it was read", ''a conflict and an unknown linkage come through
        the served path'', ''the same Codex login email under different account ids comes through the served path as two allowances'', ''every registry host appears
        with its status: unreachable, older, off, ssh; the rest and this host still served'', ''an ordinary read never starts a native read, here or on any host;
        it only GETs served memory'', ''an entry naming this daemon is skipped and said so; ?hosts narrows; an unknown id is a 400'', "with no host registry (the
        real reader, a missing file) it is this host only, saying so; a malformed one says it''s unreadable", ''switch off here: both routes refuse with 409 naming
        the key, and no host is contacted'', ''no bearer, bearer variable or bearer file reaches the served body'', ''a refresh slower than the 5 s read class still
        succeeds, and its reading reaches the view'', ''a Claude refresh slower than the 5 s read class still succeeds, and its identity reaches the view'', "a leg
        past its bound fails with its own time and reason, and the host''s earlier observation stays beside it", ''overlapping matching refreshes share one native
        read on the host, from one hub and from two'', "a host''s own failed read comes back as that host''s outcome; each other kind of host says why", ''refuses
        a bad provider or hosts list'', ''F1 through the served route: two hosts with the same Codex account and no login email stay apart as unknown'', "F2: past
        its deadline the view answers with what it has, naming each host it didn''t hear from; the refresh answers with the same view and every provider''s legs",
        ''F3: a host serving a malformed window or identity is unavailable with the reason; the others are served'', ''F4: a host echoing its configured bearer in
        a row or a refresh detail has it replaced, in the answer and the kept record'', ''F5: an answer over the byte bound is not read further; that host is unavailable,
        or its leg failed, and the rest are served'', "F6: a registered host''s redirect is not followed, for the view or the refresh; the other service sees nothing",
        "today''s real rows and seat accounts all pass the checks", ''each rendered field class: a malformed host is unavailable with the reason; this host and a
        healthy one are served'', "a settings value that can''t be shown is named as such; the answer is served", ''an answer nested 2,000 deep, with a configured
        bearer: that host unavailable, its leg failed; the rest served'', ''each exchange is scrubbed with the bearer it sent: a refresh echoing the sent A after
        a rotation to B, and settings echoing the newer B'', ''an empty Codex login email is no evidence either: it links to nothing'', "an identity carrying another
        provider''s key with an unprintable value: that host unavailable, this host and a healthy one served", "another provider''s key with a value of the right
        type is served (absent or typed is fine)"]

        assert sorted(a["title"] for a in all_assertions)==sorted(expected_titles)

        assert len(all_assertions)==39

        assert [a["fullName"] for a in all_assertions if a["status"]!="passed"]==[a[0]["fullName"]]

        pathlib.Path(os.environ["RUNNER_TEMP"],"attribution-case-statuses.json").write_text(json.dumps({a["fullName"]:a["status"] for a in all_assertions},indent=2))


        assert d["numRuntimeErrorTestSuites"]==0,d

        assert d["numTotalTests"]==39 and d["numPassedTests"]==38 and d["numFailedTests"]==1 and d["numPendingTests"]==0,d

        all_assertions=[a for t in d["testResults"] for a in t["assertionResults"]]

        expected_titles=[''one allowance on two hosts is one group with both observations, verbatim and never summed'', ''the same allowance whose fresh resets are
        more than 60 s apart is a conflict, both kept, none chosen'', ''resets within 60 s, or a stale observation that disagrees, are not a conflict'', ''the same
        Codex account id under different login emails stays apart as unknown linkage, naming the other host and the id'', ''a missing Codex login email links to nothing:
        by account id, by workspace id, and beside a reported email'', ''the same Claude email in two organisations is two allowances'', ''the same Codex login email
        under different account ids is two allowances, each its own entry'', ''an unresolved identity, or a source never read, is its own entry and never matched'',
        "map each kind of host answer to a leg; a bearer that can''t be resolved is never named", ''a leg asked for while the same (host, provider) leg runs joins
        it'', "one allowance on two hosts appears once, with each host''s own served row and the time it was read", ''a conflict and an unknown linkage come through
        the served path'', ''the same Codex login email under different account ids comes through the served path as two allowances'', ''every registry host appears
        with its status: unreachable, older, off, ssh; the rest and this host still served'', ''an ordinary read never starts a native read, here or on any host;
        it only GETs served memory'', ''an entry naming this daemon is skipped and said so; ?hosts narrows; an unknown id is a 400'', "with no host registry (the
        real reader, a missing file) it is this host only, saying so; a malformed one says it''s unreadable", ''switch off here: both routes refuse with 409 naming
        the key, and no host is contacted'', ''no bearer, bearer variable or bearer file reaches the served body'', ''a refresh slower than the 5 s read class still
        succeeds, and its reading reaches the view'', ''a Claude refresh slower than the 5 s read class still succeeds, and its identity reaches the view'', "a leg
        past its bound fails with its own time and reason, and the host''s earlier observation stays beside it", ''overlapping matching refreshes share one native
        read on the host, from one hub and from two'', "a host''s own failed read comes back as that host''s outcome; each other kind of host says why", ''refuses
        a bad provider or hosts list'', ''F1 through the served route: two hosts with the same Codex account and no login email stay apart as unknown'', "F2: past
        its deadline the view answers with what it has, naming each host it didn''t hear from; the refresh answers with the same view and every provider''s legs",
        ''F3: a host serving a malformed window or identity is unavailable with the reason; the others are served'', ''F4: a host echoing its configured bearer in
        a row or a refresh detail has it replaced, in the answer and the kept record'', ''F5: an answer over the byte bound is not read further; that host is unavailable,
        or its leg failed, and the rest are served'', "F6: a registered host''s redirect is not followed, for the view or the refresh; the other service sees nothing",
        "today''s real rows and seat accounts all pass the checks", ''each rendered field class: a malformed host is unavailable with the reason; this host and a
        healthy one are served'', "a settings value that can''t be shown is named as such; the answer is served", ''an answer nested 2,000 deep, with a configured
        bearer: that host unavailable, its leg failed; the rest served'', ''each exchange is scrubbed with the bearer it sent: a refresh echoing the sent A after
        a rotation to B, and settings echoing the newer B'', ''an empty Codex login email is no evidence either: it links to nothing'', "an identity carrying another
        provider''s key with an unprintable value: that host unavailable, this host and a healthy one served", "another provider''s key with a value of the right
        type is served (absent or typed is fine)"]

        assert sorted(a["title"] for a in all_assertions)==sorted(expected_titles)

        assert len(all_assertions)==39

        assert [a["fullName"] for a in all_assertions if a["status"]!="passed"]==[a[0]["fullName"]]

        pathlib.Path(os.environ["RUNNER_TEMP"],"attribution-case-statuses.json").write_text(json.dumps({a["fullName"]:a["status"] for a in all_assertions},indent=2))

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openrig1415-daemon-baseline-${{ github.run_id }}
        path: '${{ runner.temp }}/source-identity-*.json

          ${{ runner.temp }}/opr-test.*/daemon-probe.json

          ${{ runner.temp }}/attribution-case-statuses.json'
        if-no-files-found: error
  candidate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
        persist-credentials: false
        repository: mvschwarz/openrig
        ref: d93377f3f9d9728458127c7e8773484cfdd82dd6
    - name: Exact initial source guard
      shell: python
      run: 'import subprocess

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''d93377f3f9d9728458127c7e8773484cfdd82dd6''

        assert not subprocess.check_output([''git'',''status'',''--porcelain''])'
    - name: Apply exact reviewed source packet
      shell: python
      run: 'import base64,hashlib,pathlib,subprocess,json

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''d93377f3f9d9728458127c7e8773484cfdd82dd6''

        p=base64.b64decode('''');
        assert hashlib.sha256(p).hexdigest()==''95a45a13d1cb66595b085e92992c3de36931a74961bd6bf3f12f27492602a6b8''

        subprocess.run([''git'',''apply'',''--check'',''-''],input=p,check=True)

        subprocess.run([''git'',''apply'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/openrig1415-expected.patch'').write_bytes(p)

        pathlib.Path(''/tmp/openrig1415-files.json'').write_text(''{"packages/cli/src/commands/chatroom.ts": {"baseline_sha256": "a663d18fa0f5a8446e5b4ae49419c10fa8f38e286584ed3867558b07cd62b1c6",
        "candidate_sha256": "2cdee3fa5f191bb17b2a988570801d42bc06f9bda38352eb09801766ecb13c3a", "snapshot": "/Users/rudycelekli/Downloads/RLGYM/upstream-prs-2026-09/campaign-records/daily-runs/20261020T125951Z-heartbeat/lane-3/openrig1415/candidate-chatroom.ts"},
        "packages/cli/test/chatroom-watch-tmux-args.test.ts": {"baseline_sha256": "e8fbdd008f59438eba68965f7c1d87cb9b68a5401d609472bed58aa6a0a2427d", "candidate_sha256":
        "f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558", "snapshot": "/Users/rudycelekli/Downloads/RLGYM/upstream-prs-2026-09/campaign-records/daily-runs/20261020T125951Z-heartbeat/lane-3/openrig1415/candidate-chatroom-watch-tmux-args.test.ts"}}'')

        '
    - name: Strict candidate identity before native gates
      shell: python
      run: 'import subprocess,pathlib,hashlib,json,os

        expected={''packages/cli/src/commands/chatroom.ts'': ''2cdee3fa5f191bb17b2a988570801d42bc06f9bda38352eb09801766ecb13c3a'', ''packages/cli/test/chatroom-watch-tmux-args.test.ts'':
        ''f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558''}

        for p,h in expected.items(): assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,(p,''source bytes changed'')

        actual=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert actual==pathlib.Path(''/tmp/openrig1415-expected.patch'').read_bytes(),''canonical patch/path identity changed''

        pathlib.Path(os.environ[''RUNNER_TEMP''],''source-identity-''+os.environ.get(''QUAL_PHASE'',''unknown'')+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(actual).hexdigest(),''files'':expected},indent=2))

        '
      env:
        QUAL_PHASE: before
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: brew install tmux
    - run: npm ci
    - name: Build the packages the tests import
      run: npm run build
    - name: Run the suite without ambient credentials or external network
      run: "echo \"Starting unmodified fixture at $(date -u +%FT%TZ)\"\nsuite_root=$(mktemp -d \"$RUNNER_TEMP/opr-test.XXXXXX\")\nsuite_root=$(cd \"$suite_root\"\
        \ && pwd -P)\nmkdir -p \"$suite_root/home\" \"$suite_root/bin\"\n# Same system bytes, nonprivileged mode; no system file is changed.\n/usr/bin/install -m\
        \ 0755 /bin/ps \"$suite_root/bin/ps\"\n# Only this job's temporary sockets (including tmux) are reachable.\nenv -i HOME=\"$suite_root/home\" PATH=\"$PATH\"\
        \ TMPDIR=\"$suite_root\" TMUX_TMPDIR=\"$suite_root\" \\\n  CI=true TERM=xterm-256color \\\n  sandbox-exec -D IPC_ROOT=\"$suite_root\" -p '(version 1)(allow\
        \ default)(deny network-outbound)(allow network-outbound (remote ip \"localhost:*\"))(allow network-outbound (subpath (param \"IPC_ROOT\")))' \\\n  /bin/bash\
        \ -s \"daemon\" <<'SUITE'\nset -euo pipefail\nnode scripts/ci-macos-process-probe.mjs\n# The production readers use bare ps. Select real system bytes only\
        \ after\n# self/owned-child observation and network/IPC confinement are proved.\nexport PATH=\"$TMPDIR/bin:$PATH\"\ntest \"$(command -v ps)\" = \"$TMPDIR/bin/ps\"\
        \nexec npm run test -w \"packages/$1\" -- test/provider-usage-across-hosts.test.ts --reporter=json --outputFile=\"$TMPDIR/daemon-probe.json\"\nSUITE\n\n"
      continue-on-error: true
      id: probe
    - name: Strict candidate identity after native gates
      shell: python
      run: 'import subprocess,pathlib,hashlib,json,os

        expected={''packages/cli/src/commands/chatroom.ts'': ''2cdee3fa5f191bb17b2a988570801d42bc06f9bda38352eb09801766ecb13c3a'', ''packages/cli/test/chatroom-watch-tmux-args.test.ts'':
        ''f23aa6acf04376b0f3da42233cbe7461bbebbc4912e4ad0e27ec132afd9c5558''}

        for p,h in expected.items(): assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,(p,''source bytes changed'')

        actual=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert actual==pathlib.Path(''/tmp/openrig1415-expected.patch'').read_bytes(),''canonical patch/path identity changed''

        pathlib.Path(os.environ[''RUNNER_TEMP''],''source-identity-''+os.environ.get(''QUAL_PHASE'',''unknown'')+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(actual).hexdigest(),''files'':expected},indent=2))

        '
      if: always()
      env:
        QUAL_PHASE: after
    - *id001
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openrig1415-daemon-candidate-${{ github.run_id }}
        path: '${{ runner.temp }}/source-identity-*.json

          ${{ runner.temp }}/opr-test.*/daemon-probe.json

          ${{ runner.temp }}/attribution-case-statuses.json'
        if-no-files-found: error
